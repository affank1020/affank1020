name: Update profile cards

on:
  push:
    paths:
      - ".github/workflows/profile-cards.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: affank1020
          cards: overview,languages
          output-dir: assets/profile
          themes: light,dark
          commit: true
