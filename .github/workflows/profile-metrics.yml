name: Update profile metrics

on:
  push:
    paths:
      - ".github/workflows/profile-metrics.yml"
      - "scripts/render_profile.py"
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_profile.py
      - name: Commit updated cards
        run: |
          git add -A README.md assets/profile
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh profile metrics [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
